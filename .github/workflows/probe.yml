name: Shop probe (temporary)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i playwright@1.49.1 && npx playwright install --with-deps chromium
        working-directory: cloud/test
      - run: node probe.mjs "https://www.ceneo.pl/;szukaj-pad+dualsense+bialy" "https://www.ceneo.pl/;szukaj-puma+speedcat+og"
        working-directory: cloud/test
