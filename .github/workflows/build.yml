# Builds the Mac (.dmg) and Windows (.exe) installers and publishes them as a GitHub Release.
name: Build apps
on:
  push:
    branches: [main]
    paths: ["desktop/**", "web/**", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy the web page into the app
        shell: bash
        run: |
          rm -rf web && cp -r ../web web
          echo '{"build": ${{ github.run_number }}}' > build-info.json
      - run: npm install
      - name: Build
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then npm run dist:mac; else npm run dist:win; fi
      - uses: actions/upload-artifact@v4
        with:
          name: okazje-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Okazje (build ${{ github.run_number }})
          make_latest: true
          files: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
